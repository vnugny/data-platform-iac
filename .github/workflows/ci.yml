name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive terraform/

      - name: Validate dev environment
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image
        uses: docker/build-push-action@v5
        with:
          context: docker/airflow
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Spark image
        uses: docker/build-push-action@v5
        with:
          context: docker/spark
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres minio
          sleep 15

      - name: Health check MinIO
        run: curl -f http://localhost:9000/minio/health/live

      - name: Health check Postgres
        run: docker compose -f docker/docker-compose.yml exec -T postgres pg_isready -U airflow

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
