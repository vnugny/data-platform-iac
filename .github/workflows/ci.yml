name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# CI validates and lints the infrastructure definitions; it does not provision
# cloud resources or boot the full local stack on every push. Rationale in
# docs/decisions/002-ci-validates-not-provisions.md.
jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate dev environment
        working-directory: terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  hadolint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - docker/airflow/Dockerfile
          - docker/spark/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
